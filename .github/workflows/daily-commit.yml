name: Daily Commit Automation

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  daily-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # ✅ allows pushing commits

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Add daily update commit by 23f2001912@ds.study.iitm.ac.in
        run: |
          echo "Last updated on $(date)" > daily_update_log.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add daily_update_log.txt
          git commit -m "Automated daily update $(date)" || echo "No changes to commit"
          git push

