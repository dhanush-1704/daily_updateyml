name: Daily Commit Automation

on:
  schedule:
    # Runs every day at 06:00 UTC (you can change time later)
    - cron: "0 6 * * *"
  workflow_dispatch: # allows manual runs too

jobs:
  daily-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Add daily update commit by 23f2001912@ds.study.iitm.ac.in
        run: |
          echo "Last updated on $(date)" > daily_update_log.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add daily_update_log.txt
          git commit -m "Automated daily update $(date)"
          git push
